title: Level X
tagline: Customer path + apps
description: >-
  Level X Consulting LLC finds where a business loses customers between
  interest and a booked job — then fixes the path with practical systems and
  AI automation. We also build our own apps.
url: https://levelxinc.com
baseurl: ""
lang: en
author:
  name: Level X
logo: /assets/img/logo-mark.svg
image: /og-image.png

permalink: /blog/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /feed.xml

social:
  name: Level X
  links:
    - https://levelxinc.github.io/

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
