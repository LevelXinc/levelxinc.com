<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>
{% include lxdefs.html %}
{% include header.html %}
<main id="content">
{{ content }}
</main>
{% include footer.html %}
<script>
(function(){
  var y=document.getElementById('yr'); if(y) y.textContent=new Date().getFullYear();
  var hdr=document.getElementById('hdr');
  function onScroll(){ if(hdr) hdr.classList.toggle('scrolled', window.scrollY>8); }
  onScroll(); window.addEventListener('scroll',onScroll,{passive:true});
  var els=document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(en){ en.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{threshold:0,rootMargin:'0px 0px -60px 0px'});
    els.forEach(function(el,i){ el.style.transitionDelay=(Math.min(i,6)*0.05)+'s'; io.observe(el); });
  } else { els.forEach(function(el){ el.classList.add('in'); }); }
})();
</script>
</body>
</html>
