<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<meta name="theme-color" content="#16161D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

{% seo %}
{% feed_meta %}

<!-- Organization (sitewide entity for search + AI) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "{{ site.url }}/#org",
  "name": "Level X",
  "alternateName": "Level X Consulting LLC",
  "url": "{{ site.url }}/",
  "description": "An independent mobile app studio building calm, careful apps for kids and families.",
  "logo": "{{ site.url }}/assets/img/logo-mark.svg",
  "sameAs": ["https://levelxinc.github.io/"],
  "contactPoint": { "@type": "ContactPoint", "contactType": "customer support", "url": "{{ site.url }}/#contact" }
}
</script>
